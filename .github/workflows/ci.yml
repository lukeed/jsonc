name: CI

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bun
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun check
      - run: bun test --coverage

  node:
    name: Node.js v${{ matrix.nodejs }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        nodejs: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.nodejs }}

      - name: Import
        run: |
          node --input-type=module -e "
            import { parse, toJSON } from './index.ts';
            let input = '{\"a\": [1, 2,], /* c */ \"b\": \"//\", // d\n}';
            for (let s of [input, input + ' '.repeat(3000)]) {
              if (toJSON(s).length !== s.length) process.exit(1);
              if (JSON.stringify(parse(s)) !== '{\"a\":[1,2],\"b\":\"//\"}') process.exit(1);
            }
          "
